<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Monochrome Draggable Kinetic Calculator</title>
    <style>
        /* --- BLACK & WHITE AESTHETIC COLOR PALETTE --- */
        :root {
            --bg-grad-1: #000000;
            --bg-grad-2: #0d0d0d;
            --calc-bg: rgba(20, 20, 20, 0.65);
            --calc-border: rgba(255, 255, 255, 0.18);
            --calc-shadow: rgba(0, 0, 0, 0.85);
            
            --screen-bg: rgba(5, 5, 5, 0.85);
            --screen-glow: rgba(255, 255, 255, 0.15);
            --text-primary: #ffffff;
            --text-secondary: #888888;

            /* Monochrome Button Archetypes */
            --btn-num-bg: rgba(255, 255, 255, 0.05);
            --btn-num-border: rgba(255, 255, 255, 0.15);
            --btn-num-glow: rgba(255, 255, 255, 0.3);

            --btn-op-bg: rgba(255, 255, 255, 0.12);
            --btn-op-border: rgba(255, 255, 255, 0.35);
            --btn-op-glow: rgba(255, 255, 255, 0.5);
            --btn-op-text: #ffffff;

            --btn-fn-bg: rgba(255, 255, 255, 0.08);
            --btn-fn-border: rgba(255, 255, 255, 0.25);
            --btn-fn-glow: rgba(255, 255, 255, 0.4);
            --btn-fn-text: #dddddd;

            --btn-eq-bg: linear-gradient(135deg, #ffffff, #aaaaaa);
            --btn-eq-glow: rgba(255, 255, 255, 0.8);
            --btn-eq-text: #000000;
        }

        /* --- BASE RESET --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 50% 30%, #1a1a1a, var(--bg-grad-1), var(--bg-grad-2));
            overflow: hidden;
            perspective: 1200px;
        }

        /* Ambient Animated Background Spheres */
        .ambient-sphere {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            animation: float 12s infinite alternate ease-in-out;
            pointer-events: none;
        }
        .sphere-1 {
            width: 380px;
            height: 380px;
            background: rgba(255, 255, 255, 0.1);
            top: 10%;
            left: 15%;
        }
        .sphere-2 {
            width: 420px;
            height: 420px;
            background: rgba(255, 255, 255, 0.05);
            bottom: 10%;
            right: 15%;
            animation-delay: -6s;
        }

        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-40px) scale(1.08); }
        }

        /* --- DRAGGABLE & 3D CALCULATOR CONTAINER --- */
        .calculator-wrapper {
            position: absolute;
            z-index: 1;
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out;
            cursor: default;
        }

        .calculator {
            width: 380px;
            padding: 28px;
            background: var(--calc-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--calc-border);
            border-radius: 32px;
            box-shadow: 
                0 30px 60px var(--calc-shadow),
                inset 0 1px 1px rgba(255, 255, 255, 0.4),
                inset 0 -2px 8px rgba(0, 0, 0, 0.8);
            transform-style: preserve-3d;
            position: relative;
        }

        /* Drag Handle Header Bar */
        .drag-header {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-bottom: 12px;
            cursor: grab;
        }
        .drag-header:active {
            cursor: grabbing;
        }
        .drag-handle {
            width: 40px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            transition: background 0.2s;
        }
        .drag-header:hover .drag-handle {
            background: rgba(255, 255, 255, 0.7);
        }

        /* Particle Canvas Overlay */
        #particleCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            border-radius: 32px;
            z-index: 10;
        }

        /* --- DISPLAY SCREEN --- */
        .screen-container {
            background: var(--screen-bg);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 24px;
            text-align: right;
            box-shadow: 
                inset 0 4px 12px rgba(0, 0, 0, 0.9),
                0 0 20px var(--screen-glow);
            transform: translateZ(25px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
            cursor: grab;
        }
        .screen-container:active {
            cursor: grabbing;
        }

        .screen-container.flash {
            animation: screenFlash 0.3s ease-out;
        }

        @keyframes screenFlash {
            0% { box-shadow: inset 0 4px 12px rgba(0,0,0,0.9), 0 0 40px rgba(255, 255, 255, 0.9); }
            100% { box-shadow: inset 0 4px 12px rgba(0,0,0,0.9), 0 0 20px var(--screen-glow); }
        }

        .history-text {
            min-height: 20px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .main-text {
            font-size: 2.5rem;
            font-weight: 300;
            color: var(--text-primary);
            letter-spacing: 1px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        /* --- BUTTON GRID --- */
        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            transform-style: preserve-3d;
        }

        /* --- 3D BUTTON STYLING --- */
        .btn {
            position: relative;
            height: 64px;
            border: none;
            outline: none;
            border-radius: 16px;
            cursor: pointer;
            font-size: 1.25rem;
            font-weight: 500;
            color: var(--text-primary);
            background: var(--btn-num-bg);
            border-top: 1px solid var(--btn-num-border);
            border-left: 1px solid var(--btn-num-border);
            box-shadow: 
                0 6px 0 rgba(0, 0, 0, 0.6),
                0 10px 15px rgba(0, 0, 0, 0.5);
            transform-style: preserve-3d;
            transform: translateZ(15px);
            transition: transform 0.12s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.12s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.2s ease;
        }

        .btn:hover {
            transform: translateZ(22px) translateY(-2px);
            box-shadow: 
                0 8px 0 rgba(0, 0, 0, 0.6),
                0 15px 20px var(--btn-num-glow);
        }

        .btn:active, .btn.active {
            transform: translateZ(5px) translateY(4px) !important;
            box-shadow: 
                0 2px 0 rgba(0, 0, 0, 0.6),
                0 4px 8px rgba(0, 0, 0, 0.5) !important;
        }

        /* Button Variants */
        .btn-operator {
            background: var(--btn-op-bg);
            border-color: var(--btn-op-border);
            color: var(--btn-op-text);
        }
        .btn-operator:hover {
            box-shadow: 0 8px 0 rgba(0, 0, 0, 0.6), 0 0 20px var(--btn-op-glow);
        }

        .btn-func {
            background: var(--btn-fn-bg);
            border-color: var(--btn-fn-border);
            color: var(--btn-fn-text);
        }
        .btn-func:hover {
            box-shadow: 0 8px 0 rgba(0, 0, 0, 0.6), 0 0 20px var(--btn-fn-glow);
        }

        .btn-equal {
            background: var(--btn-eq-bg);
            color: var(--btn-eq-text);
            font-weight: 700;
            border: none;
            grid-column: span 2;
        }
        .btn-equal:hover {
            box-shadow: 0 8px 0 rgba(0, 0, 0, 0.6), 0 0 25px var(--btn-eq-glow);
        }

        /* --- RESPONSIVE ADJUSTMENTS --- */
        @media (max-width: 420px) {
            .calculator {
                width: 320px;
                padding: 20px;
            }
            .btn {
                height: 54px;
                font-size: 1.1rem;
            }
            .main-text {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <!-- Ambient background spheres -->
    <div class="ambient-sphere sphere-1"></div>
    <div class="ambient-sphere sphere-2"></div>

    <!-- 3D Calculator Container -->
    <div class="calculator-wrapper" id="calcWrapper">
        <div class="calculator" id="calculator">
            <canvas id="particleCanvas"></canvas>
            
            <div class="drag-header" id="dragHeader">
                <div class="drag-handle"></div>
            </div>

            <div class="screen-container" id="screen">
                <div class="history-text" id="historyText"></div>
                <div class="main-text" id="mainText">0</div>
            </div>

            <div class="keypad">
                <button class="btn btn-func" data-action="clear">AC</button>
                <button class="btn btn-func" data-action="delete">DEL</button>
                <button class="btn btn-func" data-action="percent">%</button>
                <button class="btn btn-operator" data-action="operator" data-op="/">÷</button>

                <button class="btn" data-value="7">7</button>
                <button class="btn" data-value="8">8</button>
                <button class="btn" data-value="9">9</button>
                <button class="btn btn-operator" data-action="operator" data-op="*">×</button>

                <button class="btn" data-value="4">4</button>
                <button class="btn" data-value="5">5</button>
                <button class="btn" data-value="6">6</button>
                <button class="btn btn-operator" data-action="operator" data-op="-">−</button>

                <button class="btn" data-value="1">1</button>
                <button class="btn" data-value="2">2</button>
                <button class="btn" data-value="3">3</button>
                <button class="btn btn-operator" data-action="operator" data-op="+">+</button>

                <button class="btn" data-value="0">0</button>
                <button class="btn" data-value=".">.</button>
                <button class="btn btn-equal" data-action="calculate">=</button>
            </div>
        </div>
    </div>

    <script>
        /* --- STATE MANAGEMENT --- */
        let currentInput = '0';
        let previousInput = '';
        let operation = null;
        let resetInputOnNextNumber = false;

        /* --- DOM ELEMENTS --- */
        const wrapper = document.getElementById('calcWrapper');
        const calc = document.getElementById('calculator');
        const dragHeader = document.getElementById('dragHeader');
        const screen = document.getElementById('screen');
        const mainText = document.getElementById('mainText');
        const historyText = document.getElementById('historyText');
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        /* --- CANVAS RESIZE --- */
        function resizeCanvas() {
            canvas.width = calc.offsetWidth;
            canvas.height = calc.offsetHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        /* --- DRAGGABLE CALCULATOR SYSTEM --- */
        let isDragging = false;
        let dragStartX = 0, dragStartY = 0;
        let currentPosX = 0, currentPosY = 0;

        function startDrag(e) {
            isDragging = true;
            const clientX = e.type.startsWith('touch') ? e.touches[0].clientX : e.clientX;
            const clientY = e.type.startsWith('touch') ? e.touches[0].clientY : e.clientY;
            dragStartX = clientX - currentPosX;
            dragStartY = clientY - currentPosY;
        }

        function onDrag(e) {
            if (!isDragging) return;
            const clientX = e.type.startsWith('touch') ? e.touches[0].clientX : e.clientX;
            const clientY = e.type.startsWith('touch') ? e.touches[0].clientY : e.clientY;
            currentPosX = clientX - dragStartX;
            currentPosY = clientY - dragStartY;
            updateTransform();
        }

        function endDrag() {
            isDragging = false;
        }

        dragHeader.addEventListener('mousedown', startDrag);
        screen.addEventListener('mousedown', startDrag);
        document.addEventListener('mousemove', onDrag);
        document.addEventListener('mouseup', endDrag);

        dragHeader.addEventListener('touchstart', startDrag);
        screen.addEventListener('touchstart', startDrag);
        document.addEventListener('touchmove', onDrag);
        document.addEventListener('touchend', endDrag);

        /* --- 3D PARALLAX EFFECT --- */
        let rotateX = 0, rotateY = 0;
        document.addEventListener('mousemove', (e) => {
            if (isDragging) return;
            const { clientX, clientY } = e;
            const { innerWidth, innerHeight } = window;

            rotateX = ((clientY / innerHeight) - 0.5) * -25;
            rotateY = ((clientX / innerWidth) - 0.5) * 25;
            updateTransform();
        });

        function updateTransform() {
            wrapper.style.transform = `translate3d(${currentPosX}px, ${currentPosY}px, 0px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        }

        /* --- PARTICLE SYSTEM ENGINE --- */
        let particles = [];

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = Math.random() * 3 + 2;
                this.vx = (Math.random() - 0.5) * 7;
                this.vy = (Math.random() - 0.5) * 7;
                this.alpha = 1;
                this.decay = Math.random() * 0.03 + 0.02;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#ffffff';
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }
        }

        function createBurst(x, y, color) {
            const count = 18;
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function renderParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((particle, index) => {
                particle.update();
                particle.draw();
                if (particle.alpha <= 0) {
                    particles.splice(index, 1);
                }
            });
            requestAnimationFrame(renderParticles);
        }
        renderParticles();

        /* --- CALCULATOR LOGIC --- */
        function updateDisplay() {
            mainText.innerText = currentInput;
            if (operation) {
                historyText.innerText = `${previousInput} ${getOpSymbol(operation)}`;
            } else {
                historyText.innerText = '';
            }
        }

        function getOpSymbol(op) {
            switch(op) {
                case '+': return '+';
                case '-': return '−';
                case '*': return '×';
                case '/': return '÷';
                default: return '';
            }
        }

        function handleNumber(num) {
            if (currentInput === '0' || resetInputOnNextNumber) {
                currentInput = num;
                resetInputOnNextNumber = false;
            } else {
                if (currentInput.length < 12) {
                    currentInput += num;
                }
            }
            updateDisplay();
        }

        function handleDecimal() {
            if (resetInputOnNextNumber) {
                currentInput = '0.';
                resetInputOnNextNumber = false;
            } else if (!currentInput.includes('.')) {
                currentInput += '.';
            }
            updateDisplay();
        }

        function handleOperator(op) {
            if (operation !== null && !resetInputOnNextNumber) {
                calculateResult();
            }
            previousInput = currentInput;
            operation = op;
            resetInputOnNextNumber = true;
            updateDisplay();
        }

        function calculateResult() {
            if (!operation || resetInputOnNextNumber) return;

            let result = 0;
            const prev = parseFloat(previousInput);
            const current = parseFloat(currentInput);

            if (isNaN(prev) || isNaN(current)) return;

            switch (operation) {
                case '+': result = prev + current; break;
                case '-': result = prev - current; break;
                case '*': result = prev * current; break;
                case '/': 
                    result = current === 0 ? 'Error' : prev / current; 
                    break;
            }

            if (typeof result === 'number') {
                result = Math.round(result * 100000000) / 100000000;
            }

            currentInput = result.toString();
            operation = null;
            resetInputOnNextNumber = true;
            
            screen.classList.remove('flash');
            void screen.offsetWidth;
            screen.classList.add('flash');

            updateDisplay();
        }

        function clearAll() {
            currentInput = '0';
            previousInput = '';
            operation = null;
            resetInputOnNextNumber = false;
            updateDisplay();
        }

        function deleteLast() {
            if (resetInputOnNextNumber) return;
            if (currentInput.length === 1 || (currentInput.length === 2 && currentInput.startsWith('-'))) {
                currentInput = '0';
            } else {
                currentInput = currentInput.slice(0, -1);
            }
            updateDisplay();
        }

        function handlePercent() {
            currentInput = (parseFloat(currentInput) / 100).toString();
            updateDisplay();
        }

        /* --- BUTTON CLICK HANDLERS --- */
        const buttons = document.querySelectorAll('.btn');

        buttons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const rect = calc.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const clickY = e.clientY - rect.top;

                let burstColor = '#ffffff';
                if (btn.classList.contains('btn-operator')) burstColor = '#dddddd';
                else if (btn.classList.contains('btn-func')) burstColor = '#aaaaaa';

                createBurst(clickX, clickY, burstColor);

                executeButtonAction(btn);
            });
        });

        function executeButtonAction(btn) {
            const value = btn.getAttribute('data-value');
            const action = btn.getAttribute('data-action');
            const opValue = btn.getAttribute('data-op');

            if (value !== null) {
                if (value === '.') handleDecimal();
                else handleNumber(value);
            } else if (action) {
                switch (action) {
                    case 'clear': clearAll(); break;
                    case 'delete': deleteLast(); break;
                    case 'percent': handlePercent(); break;
                    case 'operator': handleOperator(opValue); break;
                    case 'calculate': calculateResult(); break;
                }
            }
        }

        /* --- KEYBOARD SUPPORT --- */
        window.addEventListener('keydown', (e) => {
            let key = e.key;
            let targetBtn = null;

            if (key >= '0' && key <= '9') {
                targetBtn = document.querySelector(`.btn[data-value="${key}"]`);
            } else if (key === '.') {
                targetBtn = document.querySelector(`.btn[data-value="."]`);
            } else if (key === '+') {
                targetBtn = document.querySelector(`.btn[data-op="+"]`);
            } else if (key === '-') {
                targetBtn = document.querySelector(`.btn[data-op="-"]`);
            } else if (key === '*') {
                targetBtn = document.querySelector(`.btn[data-op="*"]`);
            } else if (key === '/') {
                e.preventDefault();
                targetBtn = document.querySelector(`.btn[data-op="/"]`);
            } else if (key === 'Enter' || key === '=') {
                e.preventDefault();
                targetBtn = document.querySelector(`.btn-equal`);
            } else if (key === 'Backspace') {
                targetBtn = document.querySelector(`.btn[data-action="delete"]`);
            } else if (key === 'Escape') {
                targetBtn = document.querySelector(`.btn[data-action="clear"]`);
            } else if (key === '%') {
                targetBtn = document.querySelector(`.btn[data-action="percent"]`);
            }

            if (targetBtn) {
                targetBtn.classList.add('active');
                targetBtn.click();
                setTimeout(() => targetBtn.classList.remove('active'), 120);
            }
        });
    </script>
</body>
</html>
